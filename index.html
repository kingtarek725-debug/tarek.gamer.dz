<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarek Gamer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- خلفية الصورة - أضفنا مساراً احتياطياً -->
    <div class="bg-container" id="bg">
        <div class="overlay"></div>
    </div>

    <!-- الموسيقى - تأكد أن الملف mp3 -->
    <audio id="bgMusic" loop preload="auto">
        <source src="homemusic.mp3" type="audio/mpeg">
    </audio>

    <!-- زر التشغيل (ضروري جداً لأن المتصفح يمنع التشغيل التلقائي) -->
    <div id="music-btn" onclick="toggleMusic()">
        <i id="music-icon" class="fas fa-play"></i>
        <span id="btn-text">تشغيل الموسيقى</span>
    </div>

    <header>
        <div class="hero">
            <h1>TAREK GAMER</h1>
            <p>مطور سيرفرات ومصمم محترف</p>
        </div>
    </header>

    <script src="script.js"></script>
</body>
</html>
