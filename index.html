<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <title>الموقع الشخصي الاحترافي</title>
    <link rel="stylesheet" href="style.css">
    <!-- إضافة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- القائمة العلوية -->
    <nav>
        <div class="logo">المطور الإحترافي</div>
        <ul>
            <li><a href="#home">الرئيسية</a></li>
            <li><a href="#projects">المشاريع</a></li>
            <li><a href="#contact">تواصل معي</a></li>
        </ul>
    </nav>

    <!-- القسم الرئيسي -->
    <header id="home">
        <div class="hero-content">
            <h1>مرحباً بك في عالمي التقني</h1>
            <p>مطور واجهات، خبير في إدارة السيرفرات، ومصمم مبدع.</p>
            <a href="#projects" class="btn">عرض أعمالي</a>
        </div>
    </header>

    <!-- قسم المشاريع -->
    <section id="projects">
        <h2 class="section-title">أبرز المشاريع</h2>
        <div class="projects-grid">
            <div class="project-card">
                <i class="fas fa-server fa-3x"></i>
                <h3>تطوير السيرفرات</h3>
                <p>تطوير سكربتات متقدمة وأنظمة إدارة قواعد بيانات.</p>
            </div>
            <div class="project-card">
                <i class="fas fa-code fa-3x"></i>
                <h3>برمجة الويب</h3>
                <p>تصميم مواقع تفاعلية واحترافية باستخدام أحدث التقنيات.</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
